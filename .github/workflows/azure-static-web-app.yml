name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "marjane_final/**"
      - ".github/workflows/azure-static-web-app.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "marjane_final/**"

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "marjane_final"
          output_location: "dist"
          skip_app_build: false
        env:
          # Baked into the build at compile time — must point at wherever
          # the backend ends up (Azure App Service URL, Railway URL, etc.).
          # Set the *real* value as a repo variable (Settings > Secrets and
          # variables > Actions > Variables) named VITE_API_BASE.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
