name: Deploy backend to Azure App Service

# Auto-trigger (push) is off until the Azure App Service resource exists
# and AZURE_WEBAPP_PUBLISH_PROFILE/AZURE_WEBAPP_NAME are set — otherwise
# every push fails for lack of anything to deploy to. Run manually via the
# Actions tab once that's set up, or restore the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/azure-app-service-backend.yml"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # App Service's Python builder normally does this for you on the
      # server side (Oryx), but zipping our own deploy package here keeps
      # the workflow explicit about what actually ships.
      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../backend-release.zip . -x "__pycache__/*" "*.pyc" "samples/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          # Set this as a repo Variable (Settings > Secrets and variables >
          # Actions > Variables) — it's the name you gave the App Service
          # resource in the Azure Portal, not a secret.
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-release.zip
